name: Verify visual assets
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check-meshes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mesh tools
        run: python -m pip install -r tools/mesh-requirements.txt
      - name: Check STL and GLB geometry and hashes
        run: python tools/export_visual_meshes.py --check
      - name: Verify the Simscape XML and companion geometry paths
        run: python tools/check_cad_export.py simulation/cad-export/Full_Robot_Assembly.xml
      - name: Explain the 6-DOF joints (CAD mates, non-strict)
        run: python tools/check_cad_mates.py simulation/cad-export/Full_Robot_Assembly.xml
  consistency-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install numpy pyserial pytest
      - name: Config, URDF, firmware and wiring consistency tests
        run: python -m pytest -q
