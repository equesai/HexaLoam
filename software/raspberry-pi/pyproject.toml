[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hexaloam-controller"
version = "0.1.0"
description = "Raspberry Pi high-level kinematics, gait, communication, and ROS2 controller for the HexaLoam 18-DOF hexapod."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
ros2 = []

[tool.pytest.ini_options]
testpaths = ["tests"]
