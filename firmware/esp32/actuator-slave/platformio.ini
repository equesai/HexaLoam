[platformio]
default_envs = esp32_single_18dof

[env]
platform = espressif32 @ ^6.8.1
board = esp32dev
framework = arduino
monitor_speed = 460800
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.2
    bblanchon/ArduinoJson @ ^7.2.0
build_flags =
    -I../../shared
    -DHEXALOAM_BAUD=460800

[env:esp32_single_18dof]
build_flags = ${env.build_flags} -DHEXALOAM_CTRL_ID=1 -DHEXALOAM_NUM_JOINTS=18 -DHEXALOAM_DUAL_PCA=1

[env:esp32_dual_left]
build_flags = ${env.build_flags} -DHEXALOAM_CTRL_ID=1 -DHEXALOAM_NUM_JOINTS=9 -DHEXALOAM_JOINT_OFFSET=0 -DHEXALOAM_DUAL_PCA=0

[env:esp32_dual_right]
build_flags = ${env.build_flags} -DHEXALOAM_CTRL_ID=2 -DHEXALOAM_NUM_JOINTS=9 -DHEXALOAM_JOINT_OFFSET=9 -DHEXALOAM_DUAL_PCA=0

[env:esp32_standalone]
build_flags = ${env.build_flags} -DHEXALOAM_CTRL_ID=1 -DHEXALOAM_NUM_JOINTS=18 -DHEXALOAM_DUAL_PCA=1 -DHEXALOAM_STANDALONE_GAIT=1

; MA2 mirrored in software on companion PCA9685 boards 0x42/0x43 (no PWM reverser needed)
[env:esp32_single_18dof_ma2_software]
build_flags = ${env.build_flags} -DHEXALOAM_CTRL_ID=1 -DHEXALOAM_NUM_JOINTS=18 -DHEXALOAM_DUAL_PCA=1 -DHEXALOAM_MA2_SOFTWARE=1
